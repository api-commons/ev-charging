standard: ocpi-2.2.1
source: https://github.com/ocpi/ocpi/tree/release-2.2.1-bugfixes
concepts:
  charger:
    objects:
    - EVSE
    - Connector
    core_coverage: 0.5
    extended_coverage: 0.0
    core_missing_from_standard:
    - name
    crosswalk:
      id: uid
      evse_id: evse_id
      status: status
      capabilities: capabilities
      updated_at: last_updated
      connector_type: standard
    standard_only:
    - status_schedule
    - connectors
    - floor_level
    - coordinates
    - physical_reference
    - directions
    - parking_restrictions
    - images
    - format
    - power_type
    - max_voltage
    - max_amperage
    - max_electric_power
    - tariff_ids
    - terms_and_conditions
  charging_session:
    objects:
    - Session
    core_coverage: 1.0
    extended_coverage: 0.0
    core_missing_from_standard: []
    crosswalk:
      id: id
      started_at: start_date_time
      ended_at: end_date_time
      location_id: location_id
      charger_id: evse_uid
      cost: total_cost
      updated_at: last_updated
    standard_only:
    - country_code
    - party_id
    - kwh
    - cdr_token
    - auth_method
    - authorization_reference
    - meter_id
    - currency
    - charging_periods
    - status
defines_unpublished:
  charging_location:
    object: Location
    fields:
    - country_code
    - party_id
    - id
    - publish
    - publish_allowed_to
    - name
    - address
    - city
    - postal_code
    - state
    - country
    - coordinates
    - related_locations
    - parking_type
    - evses
    - directions
    - operator
    - suboperator
    - owner
    - facilities
    - time_zone
    - opening_times
    - charging_when_closed
    - images
    - energy_mix
    - last_updated
  tariff:
    object: Tariff
    fields:
    - country_code
    - party_id
    - id
    - currency
    - type
    - tariff_alt_text
    - tariff_alt_url
    - min_price
    - max_price
    - elements
    - start_date_time
    - end_date_time
    - energy_mix
    - last_updated
  charge_detail_record:
    object: CDR
    fields:
    - country_code
    - party_id
    - id
    - start_date_time
    - end_date_time
    - session_id
    - cdr_token
    - auth_method
    - authorization_reference
    - cdr_location
    - meter_id
    - currency
    - tariffs
    - charging_periods
    - signed_data
    - total_cost
    - total_fixed_cost
    - total_energy
    - total_energy_cost
    - total_time
    - total_time_cost
    - total_parking_time
    - total_parking_cost
    - total_reservation_cost
    - remark
    - invoice_reference_id
    - credit
    - credit_reference_id
    - home_charging_compensation
    - last_updated
