overlay: 1.0.0
info:
  title: EV Charging -- ocpi-2.2.1 alignment
  version: 0.1.0-draft.20261111
  description: Marks the common EV Charging OpenAPI with the ocpi-2.2.1 object each schema corresponds to, and the field each
    property maps to. Generated by scripts/overlay.py from standards/ocpi-2.2.1.yml; nothing is renamed.
extends: openapi.yml
actions:
- target: $.components.schemas.Charger
  update:
    x-commons-standard:
      standard: ocpi-2.2.1
      source: https://github.com/ocpi/ocpi/tree/release-2.2.1-bugfixes
      objects:
      - EVSE
      - Connector
      core_coverage: 0.5
      fields:
        id: uid
        evse_id: evse_id
        status: status
        capabilities: capabilities
        updated_at: last_updated
        connector_type: standard
      standard_only:
      - status_schedule
      - connectors
      - floor_level
      - coordinates
      - physical_reference
      - directions
      - parking_restrictions
      - images
      - format
      - power_type
      - max_voltage
      - max_amperage
      - max_electric_power
      - tariff_ids
      - terms_and_conditions
- target: $.components.schemas.ChargingSession
  update:
    x-commons-standard:
      standard: ocpi-2.2.1
      source: https://github.com/ocpi/ocpi/tree/release-2.2.1-bugfixes
      objects:
      - Session
      core_coverage: 1.0
      fields:
        id: id
        started_at: start_date_time
        ended_at: end_date_time
        location_id: location_id
        charger_id: evse_uid
        cost: total_cost
        updated_at: last_updated
      standard_only:
      - country_code
      - party_id
      - kwh
      - cdr_token
      - auth_method
      - authorization_reference
      - meter_id
      - currency
      - charging_periods
      - status
