context: ev-charging
name: EV Charging
intro: >-
  The common EV-charging vocabulary -- the charging locations drivers find, the chargers and
  connectors at them, the charging sessions drivers start, the tariffs that price them and the
  charge detail records that bill them -- distilled from the APIs that already exist, the OCPI
  standard included.
tags: [EV Charging, Electric Vehicles, E-Mobility, eMobility, Charging Infrastructure, OCPP, OCPI]

envelope: [_links, _pagination, _results, data, success, errors, warnings, count, total, page, meta, links,
           value, results, next, previous, has_more, message, status_code, ids, next_page, previous_page,
           page_info, cursor, total_count, per_page, total_pages, current_page, object, url, timestamp_response, status_message]

common_fields:
  id: [uuid, guid, object_id, record_id, external_id, uid]
  created_at: [created, created_date, date_created, create_time, creation_date, created_on]
  updated_at: [updated, updated_date, modified_at, last_modified, date_modified, update_time, modified_date, modified, last_updated]
  metadata: [meta_data, custom_fields, custom, attributes, properties]
  status: [state, availability, status_code, operational_status, connector_status]
  name: [title, display_name, label]
  location_id: [location, site_id, site, station_id, location_uid]
  currency: [currency_code]

concepts:
  # charging_location was measured and dropped: 2 providers once energy-company sites and
  # customer sites were set aside.
  charger:
    segments: [evses, evse, chargers, charger, charge_points, charge-points, chargepoints, chargeboxes, charging_points, charge_stations, connectors]
    aliases:
      evse_id: [evse_uid, charge_point_id, charge_box_id, ocpp_id, identity]
      connectors: [connector, plugs, outlets, sockets]
      max_power: [max_electric_power, power_kw, max_power_kw, rated_power, power]
      connector_type: [standard, plug_type, connector_standard, socket_type]
      last_seen_at: [last_heartbeat, last_seen, heartbeat_at]
  charging_session:
    requires: [charger]
    path: /charging-sessions
    segments: [sessions, session, charging_sessions, charging-sessions, chargingsessions, charges@chargers, transactions@ocpp|chargers|charge_points|evses]
    aliases:
      started_at: [start_date_time, start_time, start, started, start_datetime]
      ended_at: [end_date_time, end_time, end, stopped_at, stop_time, ended]
      energy_kwh: [kwh, energy, energy_delivered, energy_consumed, meter_value, total_energy, energy_wh]
      cost: [total_cost, price, amount, total_price]
      charger_id: [evse_uid, evse_id, charge_point_id, charger, connector_id]
      driver_id: [driver, user_id, auth_id, token_uid, id_tag]
  # tariff and charge_detail_record were measured and dropped: 2 and 0 providers.

duplicates:
  leapfrog-power: [leap]

findings:
  - "EV charging publishes the least of any context in the commons: 41 tagged providers, 4 with
    a charger or session the census can read. Chargers agree on id and name; sessions on an id."
  - "OCPI -- the roaming standard that defines locations, EVSEs, sessions, tariffs and charge
    detail records -- does not appear in this cohort as harvested OpenAPI: no provider here
    publishes an OCPI contract the census can read. The standard exists; its OpenAPI is not in
    the catalog."
decisions:
  - "Only chargers and charging sessions are published; locations, tariffs and charge detail
    records were measured and dropped, and are recorded for the next re-measure."
  - "Chargers cover EVSEs, charge points and charge boxes; sessions are `/charging-sessions`."
  - "An OCPI pass -- reading the standard's own module definitions as the reference, as the
    models context does for the OpenAI interface -- would give this context its spine. Noted as
    the next step rather than done by hand."
  - "Duplicates merged: Leap into Leapfrog Power."
